services:
  # ------------------------------------------------------------------
  # 1. Database Service (PostgreSQL 16)
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: listen360-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: listen360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jeetgaye@hackathon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listen360"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------------
  # 2. Backend Gateway Service (Express.js API)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: listen360-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforhackathonlisten360}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: Jeetgaye@hackathon
      DB_NAME: listen360
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-your-gcp-project-id}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 3. Frontend Web Service (Nginx serving Vite SPA)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listen360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
